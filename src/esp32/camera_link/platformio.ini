[platformio]
default_envs = esp32dev_spi_emio

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
lib_deps = bblanchon/ArduinoJson@6.21.5
monitor_speed = 115200
board_build.embed_txtfiles = web/index.html
[env:esp32dev_spi_emio]
build_flags =
    -D LM_UART_RX=16
    -D LM_UART_TX=17
    -D LM_UART_BAUD=115200
    -D LM_SPI_SCLK=18
    -D LM_SPI_MOSI=23
    -D LM_SPI_MISO=19
    -D LM_SPI_CS=27
    -D LM_SPI_READY=26
    -D LINK_SPI=1
    -D LINK_SPI_TOKEN=1
